<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#168cff" />
    <title>The Burning Wheel</title>
  </head>
  <body>
    <main id="app" aria-label="The Burning Wheel character stage">
      <div id="stage" aria-hidden="true"></div>

      <section class="hud" aria-label="Prototype controls">
        <div class="hud__label">
          <strong>THE BURNING WHEEL</strong>
          <span>JOB 04 // BIG FUCKING EYE // TAP A MOOD</span>
        </div>
        <div class="hud__actions">
          <div class="expressions" aria-label="Eye expression tester">
            <button type="button" data-expression="neutral">NEUTRAL</button>
            <button type="button" data-expression="smug">SMUG</button>
            <button type="button" data-expression="suspicious">SUS</button>
            <button type="button" data-expression="wide">WIDE</button>
            <button type="button" data-expression="offended">OFFENDED</button>
            <button type="button" data-expression="delighted">DELIGHT</button>
            <button type="button" data-expression="deadpan">DEADPAN</button>
            <button type="button" data-expression="sideEye">SIDE-EYE</button>
            <button type="button" data-expression="eyeRoll">EYE ROLL</button>
            <button type="button" data-expression="wtf">WTF</button>
          </div>
          <button id="motion-toggle" type="button" aria-pressed="false">
            PAUSE MOTION
          </button>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
