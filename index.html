<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#168cff" />
    <title>The Burning Wheel</title>
  </head>
  <body>
    <main id="app" aria-label="The Burning Wheel character stage">
      <div id="stage" aria-hidden="true"></div>

      <button id="reality-reset" type="button" title="Emergency reset (Esc)">
        RESET REALITY
      </button>

      <section class="hud is-collapsed" id="control-lab" aria-label="Prototype controls">
        <div class="hud__chrome">
          <div class="hud__label">
            <strong>THE BURNING WHEEL</strong>
            <span>JOB 09 // BRAIN BRIDGE ONLINE</span>
          </div>
          <button
            id="hud-toggle"
            class="hud__toggle"
            type="button"
            aria-expanded="false"
            aria-controls="hud-actions"
          >
            OPEN LAB
          </button>
        </div>

        <div class="hud__actions" id="hud-actions">
          <div class="control-bank">
            <div class="control-bank__name">EYE</div>
            <div class="expressions control-scroll" aria-label="Eye expression tester">
              <button class="is-active" type="button" data-expression="neutral">NEUTRAL</button>
              <button type="button" data-expression="smug">SMUG</button>
              <button type="button" data-expression="suspicious">SUS</button>
              <button type="button" data-expression="wide">WIDE</button>
              <button type="button" data-expression="offended">OFFENDED</button>
              <button type="button" data-expression="delighted">DELIGHT</button>
              <button type="button" data-expression="deadpan">DEADPAN</button>
              <button type="button" data-expression="sideEye">SIDE-EYE</button>
              <button type="button" data-expression="eyeRoll">EYE ROLL</button>
              <button type="button" data-expression="wtf">WTF</button>
            </div>
          </div>

          <div class="control-bank">
            <div class="control-bank__name">VERBS</div>
            <div class="gestures control-scroll" aria-label="Containment gesture tester">
              <button type="button" data-gesture="leanIn">LEAN</button>
              <button type="button" data-gesture="recoil">RECOIL</button>
              <button type="button" data-gesture="judgment">JUDGMENT</button>
              <button type="button" data-gesture="flare">FLARE</button>
              <button type="button" data-gesture="attractorDrift">ATTRACTOR</button>
              <button type="button" data-gesture="orientationSlip">ORIENTATION SLIP</button>
              <button type="button" data-gesture="mobiusFlip">MÖBIUS FLIP</button>
              <button type="button" data-gesture="projectionError">PROJECTION ERROR</button>
              <button type="button" data-gesture="dimensionStutter">DIMENSION STUTTER</button>
            </div>
          </div>

          <div class="control-bank control-bank--voice">
            <div class="control-bank__name">VOICE</div>
            <div class="voice-console">
              <textarea
                id="voice-text"
                rows="1"
                maxlength="1200"
                spellcheck="true"
                aria-label="Words for The Burning Wheel to speak"
                placeholder="Give the wheel a sentence..."
              >BE NOT AFRAID. I said what I said.</textarea>
              <button id="voice-speak" type="button">SPEAK</button>
              <button id="voice-stop" type="button">STOP</button>
              <span id="voice-status" role="status" aria-live="polite">THROAT IDLE</span>
              <label class="voice-speed">
                <span>SPEED</span>
                <input
                  id="voice-speed"
                  type="range"
                  min="0.80"
                  max="1.50"
                  step="0.05"
                  value="1.30"
                  aria-label="Voice playback speed"
                />
                <output id="voice-speed-value" for="voice-speed">1.30×</output>
              </label>
            </div>
          </div>

          <div class="control-bank control-bank--brain">
            <div class="control-bank__name">BRAIN</div>
            <div class="brain-console">
              <textarea
                id="brain-prompt"
                rows="4"
                maxlength="2400"
                spellcheck="true"
                aria-label="Concept or question for The Burning Wheel"
                placeholder="Give him a concept, question, or target. Example: Explain why humans confuse moral disgust with cosmic law."
              ></textarea>
              <select id="brain-preset" aria-label="Burning Wheel persona preset">
                <option value="default">DEFAULT</option>
                <option value="cosmic-roast">COSMIC ROAST</option>
                <option value="oracle">ORACLE</option>
                <option value="serious">SERIOUS</option>
              </select>
              <button id="brain-generate" type="button">THINK + DIRECT</button>
              <span id="brain-status" role="status" aria-live="polite">BRAIN IDLE</span>
            </div>
          </div>

          <div class="control-bank control-bank--director">
            <div class="control-bank__name">DIRECT</div>
            <div class="director-console">
              <textarea
                id="director-text"
                rows="5"
                spellcheck="true"
                aria-label="Raw dialogue to automatically choreograph"
                placeholder="Paste raw Burning Wheel dialogue here. He will turn it into eye acting, gestures, beats, and SAY lines."
              ></textarea>
              <button id="director-build" type="button">DIRECT THIS</button>
              <span id="director-status" role="status" aria-live="polite">DIRECTOR IDLE</span>
            </div>
          </div>

          <div class="control-bank control-bank--skit">
            <div class="control-bank__name">SKIT</div>
            <div class="skit-console">
              <textarea
                id="skit-script"
                rows="8"
                spellcheck="false"
                aria-label="Performance script"
              ># tiny rat script v0
AUTOCHAOS OFF
EYE smug 2.5
GESTURE leanIn 0.65
SAY BE NOT AFRAID. I said what I said.
BEAT 220ms
EYE sideEye 1.6
SAY Your coordinate system is adorable.
GESTURE orientationSlip 0.55
WAIT 700ms
EYE deadpan 2
SAY Anyway. You have mistaken certainty for knowledge.
GESTURE judgment 0.65
AUTOCHAOS ON</textarea>
              <div class="skit-buttons">
                <button id="skit-load-god-rant" type="button">LOAD GNOSIS RANT</button>
                <button id="skit-run" type="button">PERFORM</button>
                <button id="skit-stop" type="button">STOP SKIT</button>
              </div>
              <span id="skit-status" role="status" aria-live="polite">SKIT IDLE</span>
              <div class="skit-help">
                SAY words · EYE mood seconds · GESTURE name intensity · WAIT 0.5s · BEAT 180ms · BLINK · AUTOCHAOS ON/OFF · RESET
              </div>
            </div>
          </div>

          <div class="system-controls">
            <button id="auto-chaos" type="button" aria-pressed="true">
              AUTO CHAOS: ON
            </button>
            <button id="motion-toggle" type="button" aria-pressed="false">
              PAUSE MOTION
            </button>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
